# Nginx main configuration untuk VPN Monitor
# Lightweight & optimized

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # --- Basic ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # --- Logging ---
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- Rate Limiting ---
    # Zone untuk API: 10 req/detik per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Zone untuk login: 5 req/menit per IP (anti brute force)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # --- Upstream (App) ---
    # Untuk load balancing, tambahkan multiple server:
    # upstream vpn_monitor {
    #     server 127.0.0.1:3000;
    #     # server 127.0.0.1:3001;  # uncomment jika ada instance kedua
    #     # least_conn;              # algoritma load balancing
    #     keepalive 32;
    # }

    include /etc/nginx/conf.d/*.conf;
}
