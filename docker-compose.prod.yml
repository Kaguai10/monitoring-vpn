# ============================================================
# Web VPN Monitor - Docker Compose (Production Setup)
# App + Nginx reverse proxy; TLS dapat ditambahkan pada Nginx
#
# Untuk setup host baru, gunakan ./run.sh. Konfigurasi SSL Nginx bersifat opsional.
#
# Aplikasi menggunakan SQLite dan berjalan sebagai satu instance.
# ============================================================

services:
  app:
    build: .
    container_name: vpn-monitor-app
    restart: unless-stopped

    # Init untuk proper signal handling
    init: true

    # Host network untuk akses wg show
    network_mode: host

    cap_add:
      - NET_ADMIN

    environment:
      - TZ=${TZ:-Etc/UTC}
      - USER_DIRECTORY_CSV=/app/data/participants.csv

    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./views:/app/views:ro
      - ./public:/app/public:ro
      - ${DNSMASQ_LOG_PATH:-/var/log/dnsmasq.log}:${DNSMASQ_LOG_PATH:-/var/log/dnsmasq.log}:ro
      - /var/lib/webvpn:/var/lib/webvpn:rw
      - ${WG_CONFIG_PATH:-/etc/wireguard/wg0.conf}:${WG_CONFIG_PATH:-/etc/wireguard/wg0.conf}:ro
      - ./data/participants.csv:/app/data/participants.csv:ro
      # Timezone WIB
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:$${PORT:-3000}/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

  nginx:
    image: nginx:alpine
    container_name: vpn-monitor-nginx
    restart: unless-stopped

    # Host network agar bisa proxy ke app pada PORT dari .env
    network_mode: host

    environment:
      - APP_PORT=${PORT:-3000}
      - NGINX_ENVSUBST_FILTER=^APP_PORT$

    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
      # SSL certificates (uncomment jika pakai SSL)
      # - ./ssl:/etc/nginx/ssl:ro

    depends_on:
      - app

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
