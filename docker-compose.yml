# ============================================================
# Web VPN Monitor - Docker Compose (Simple Setup)
# Hanya app, tanpa nginx. Cocok untuk quick start.
#
# Untuk setup host baru, isi .env lalu jalankan ./run.sh.
# ============================================================

services:
  vpn-monitor:
    build: .
    container_name: vpn-monitor
    restart: unless-stopped

    # Init untuk proper signal handling (SIGTERM/SIGINT)
    init: true

    # Host network diperlukan agar `wg show` bisa akses kernel WireGuard
    network_mode: host

    # Capabilities untuk WireGuard netlink access
    cap_add:
      - NET_ADMIN

    environment:
      - TZ=${TZ:-Etc/UTC}
      - USER_DIRECTORY_CSV=/app/data/participants.csv

    volumes:
      # SQLite database persistence
      - ./data:/app/data
      # dnsmasq log (read-only)
      - ${DNSMASQ_LOG_PATH:-/var/log/dnsmasq.log}:${DNSMASQ_LOG_PATH:-/var/log/dnsmasq.log}:ro
      - /var/lib/webvpn:/var/lib/webvpn:rw
      # User management updates the persistent peer list and client configs.
      - ${WG_CONFIG_PATH:-/etc/wireguard/wg0.conf}:${WG_CONFIG_PATH:-/etc/wireguard/wg0.conf}:rw
      - /etc/wireguard/clients:/etc/wireguard/clients:rw
      # Timezone WIB
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:$${PORT:-3000}/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Resource limits - ringan tapi cukup
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
